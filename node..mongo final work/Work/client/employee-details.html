<!DOCTYPE html>
<html>

<head>
    <title>Employee Details</title>
</head>

<body>

    <h1>Employee Details</h1>

    <div id="employeeDetails"></div>

    <br>

    <button onclick="window.location.href='index.html'">
        Back to Employees
    </button>


    <script>

        // Get employee ID from URL

        const params =
            new URLSearchParams(window.location.search);

        const id =
            params.get("id");


        async function loadEmployee() {

            try {

                const response =
                    await fetch("/employees/" + id);

                const result =
                    await response.json();


                if (!response.ok) {

                    document.getElementById(
                        "employeeDetails"
                    ).innerHTML =
                        "<p>Employee not found</p>";

                    return;
                }


                const employee =
                    result.data;


                document.getElementById(
                    "employeeDetails"
                ).innerHTML = `

                    <p>
                        <strong>Employee ID:</strong>
                        ${employee.employeeId}
                    </p>

                    <p>
                        <strong>Name:</strong>
                        ${employee.name}
                    </p>

                    <p>
                        <strong>Email:</strong>
                        ${employee.email}
                    </p>

                    <p>
                        <strong>Phone:</strong>
                        ${employee.phone}
                    </p>

                    <p>
                        <strong>Department:</strong>
                        ${employee.department}
                    </p>

                    <p>
                        <strong>Designation:</strong>
                        ${employee.designation}
                    </p>

                    <p>
                        <strong>Salary:</strong>
                        ${employee.salary}
                    </p>

                    <p>
                        <strong>Joining Date:</strong>
                        ${employee.joiningDate}
                    </p>

                    <p>
                        <strong>Status:</strong>
                        ${employee.status}
                    </p>

                `;

            } catch (error) {

                console.log(error);

                document.getElementById(
                    "employeeDetails"
                ).innerHTML =
                    "<p>Server error</p>";

            }

        }


        loadEmployee();

    </script>

</body>

</html>
