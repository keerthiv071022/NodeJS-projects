<!DOCTYPE html>
<html>

<head>
    <title>Edit Employee</title>
</head>

<body>

    <h1>Edit Employee</h1>

    <form id="editForm">

        <label>Employee ID:</label>
        <input type="text" id="employeeId" readonly>
        <br><br>

        <label>Name:</label>
        <input type="text" id="name" required>
        <br><br>

        <label>Email:</label>
        <input type="email" id="email" required>
        <br><br>

        <label>Phone:</label>
        <input type="text" id="phone" required>
        <br><br>

        <label>Department:</label>

        <select id="department" required>

            <option value="Development">
                Development
            </option>

            <option value="HR">
                HR
            </option>

            <option value="Marketing">
                Marketing
            </option>

            <option value="Finance">
                Finance
            </option>

            <option value="Testing">
                Testing
            </option>

        </select>

        <br><br>


        <label>Designation:</label>
        <input type="text" id="designation" required>

        <br><br>


        <label>Salary:</label>
        <input type="number" id="salary" required>

        <br><br>


        <label>Joining Date:</label>
        <input type="date" id="joiningDate" required>

        <br><br>


        <label>Status:</label>

        <select id="status" required>

            <option value="Active">
                Active
            </option>

            <option value="Inactive">
                Inactive
            </option>

        </select>

        <br><br>


        <button type="submit">
            Update Employee
        </button>

    </form>


    <p id="message"></p>

    <br>

    <button onclick="window.location.href='index.html'">
        Back
    </button>


    <script>

        // GET ID FROM URL

        const params =
            new URLSearchParams(
                window.location.search
            );

        const id =
            params.get("id");


        // LOAD EMPLOYEE

        async function loadEmployee() {

            try {

                const response =
                    await fetch(
                        "/employees/" + id
                    );


                const result =
                    await response.json();


                if (!response.ok) {

                    alert(
                        result.message ||
                        "Employee not found"
                    );

                    return;

                }


                const employee =
                    result.data;


                document.getElementById(
                    "employeeId"
                ).value =
                    employee.employeeId;


                document.getElementById(
                    "name"
                ).value =
                    employee.name;


                document.getElementById(
                    "email"
                ).value =
                    employee.email;


                document.getElementById(
                    "phone"
                ).value =
                    employee.phone;


                document.getElementById(
                    "department"
                ).value =
                    employee.department;


                document.getElementById(
                    "designation"
                ).value =
                    employee.designation;


                document.getElementById(
                    "salary"
                ).value =
                    employee.salary;


                document.getElementById(
                    "joiningDate"
                ).value =
                    employee.joiningDate;


                document.getElementById(
                    "status"
                ).value =
                    employee.status;

            }

            catch (error) {

                console.log(error);

                alert("Server error");

            }

        }


        // UPDATE EMPLOYEE

        document
            .getElementById("editForm")
            .addEventListener(
                "submit",
                async function(event) {

                    event.preventDefault();


                    const employee = {

                        name:
                            document.getElementById(
                                "name"
                            ).value,

                        email:
                            document.getElementById(
                                "email"
                            ).value,

                        phone:
                            document.getElementById(
                                "phone"
                            ).value,

                        department:
                            document.getElementById(
                                "department"
                            ).value,

                        designation:
                            document.getElementById(
                                "designation"
                            ).value,

                        salary:
                            Number(
                                document.getElementById(
                                    "salary"
                                ).value
                            ),

                        joiningDate:
                            document.getElementById(
                                "joiningDate"
                            ).value,

                        status:
                            document.getElementById(
                                "status"
                            ).value

                    };


                    try {

                        const response =
                            await fetch(
                                "/employees/" + id,
                                {
                                    method: "PUT",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body:
                                        JSON.stringify(
                                            employee
                                        )
                                }
                            );


                        const result =
                            await response.json();


                        if (response.ok) {

                            document.getElementById(
                                "message"
                            ).innerText =
                                "Employee updated successfully!";

                        }

                        else {

                            document.getElementById(
                                "message"
                            ).innerText =
                                result.message ||
                                "Update failed";

                        }

                    }

                    catch (error) {

                        console.log(error);

                        document.getElementById(
                            "message"
                        ).innerText =
                            "Server error";

                    }

                }
            );


        // LOAD EMPLOYEE WHEN PAGE OPENS

        loadEmployee();

    </script>

</body>

</html>
