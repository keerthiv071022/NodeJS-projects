<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>
</head>

<body>

    <h1>Employee Management System</h1>

    <button onclick="window.location.href='add-employee.html'">
        Add Employee
    </button>

    <hr>

    <h2>Search Employees</h2>

    <input
        type="text"
        id="keyword"
        placeholder="Search ID, Name or Email"
    >

    <select id="department">

        <option value="">All Departments</option>
        <option value="Development">Development</option>
        <option value="HR">HR</option>
        <option value="Marketing">Marketing</option>
        <option value="Finance">Finance</option>
        <option value="Testing">Testing</option>

    </select>


    <select id="status">

        <option value="">All Status</option>
        <option value="Active">Active</option>
        <option value="Inactive">Inactive</option>

    </select>


    <button onclick="searchEmployees()">
        Search
    </button>

    <button onclick="loadEmployees()">
        Show All
    </button>

    <hr>

    <h2>Employee List</h2>


    <table border="1" cellpadding="10">

        <thead>

            <tr>

                <th>Employee ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Department</th>
                <th>Designation</th>
                <th>Salary</th>
                <th>Status</th>
                <th>Actions</th>

            </tr>

        </thead>


        <tbody id="employeeTable">

        </tbody>

    </table>


    <script>

        // LOAD ALL EMPLOYEES

        async function loadEmployees() {

            try {

                const response =
                    await fetch("/employees");

                const result =
                    await response.json();

                displayEmployees(result.data);

            } catch (error) {

                console.log(error);

                alert("Unable to load employees");

            }

        }


        // SEARCH AND FILTER

        async function searchEmployees() {

            const keyword =
                document.getElementById("keyword").value;

            const department =
                document.getElementById("department").value;

            const status =
                document.getElementById("status").value;


            const params =
                new URLSearchParams();


            if (keyword) {

                params.append(
                    "keyword",
                    keyword
                );

            }


            if (department) {

                params.append(
                    "department",
                    department
                );

            }


            if (status) {

                params.append(
                    "status",
                    status
                );

            }


            try {

                const response =
                    await fetch(
                        "/employees?" +
                        params.toString()
                    );


                const result =
                    await response.json();


                displayEmployees(result.data);

            } catch (error) {

                console.log(error);

                alert("Search failed");

            }

        }


        // DISPLAY EMPLOYEES

        function displayEmployees(employees) {

            const table =
                document.getElementById(
                    "employeeTable"
                );


            table.innerHTML = "";


            if (
                !employees ||
                employees.length === 0
            ) {

                table.innerHTML = `
                    <tr>
                        <td colspan="8">
                            No employees found
                        </td>
                    </tr>
                `;

                return;

            }


            employees.forEach(employee => {

                const row =
                    document.createElement("tr");


                row.innerHTML = `

                    <td>
                        ${employee.employeeId}
                    </td>

                    <td>
                        ${employee.name}
                    </td>

                    <td>
                        ${employee.email}
                    </td>

                    <td>
                        ${employee.department}
                    </td>

                    <td>
                        ${employee.designation}
                    </td>

                    <td>
                        ${employee.salary}
                    </td>

                    <td>
                        ${employee.status}
                    </td>

                    <td>

                        <button
                            onclick="viewEmployee('${employee.employeeId}')">
                            View
                        </button>

                        <button
                            onclick="editEmployee('${employee.employeeId}')">
                            Edit
                        </button>

                        <button
                            onclick="deleteEmployee('${employee.employeeId}')">
                            Delete
                        </button>

                    </td>

                `;


                table.appendChild(row);

            });

        }


        // VIEW

        function viewEmployee(id) {

            window.location.href =
                "employee-details.html?id=" +
                id;

        }


        // EDIT

        function editEmployee(id) {

            window.location.href =
                "edit-employee.html?id=" +
                id;

        }


        // DELETE

        async function deleteEmployee(id) {

            const answer =
                confirm(
                    "Are you sure you want to delete this employee?"
                );


            if (!answer) {

                return;

            }


            try {

                const response =
                    await fetch(
                        "/employees/" + id,
                        {
                            method: "DELETE"
                        }
                    );


                const result =
                    await response.json();


                if (response.ok) {

                    alert(
                        "Employee deleted successfully"
                    );

                    loadEmployees();

                } else {

                    alert(
                        result.message ||
                        "Delete failed"
                    );

                }

            } catch (error) {

                console.log(error);

                alert("Server error");

            }

        }


        // RUN WHEN PAGE OPENS

        loadEmployees();

    </script>

</body>

</html>
